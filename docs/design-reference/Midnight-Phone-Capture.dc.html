<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scraps. quick capture after midnight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9F7BFF}a:hover{color:#C4AEFF}
button{font:inherit;color:inherit}
textarea::placeholder{color:#A99FD0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0820; color: #F4F0FF; font-family: 'Bricolage Grotesque', system-ui, sans-serif">

<div aria-hidden="true" style="padding: 20px 18px; display: flex; flex-direction: column; gap: 16px">
  <span style="font-size: 28px; font-weight: 800; letter-spacing: -0.05em">scraps.</span>
  <div style="display: flex; gap: 12px">
    <div style="flex: 1; height: 150px; border: 2.5px solid #F4F0FF; border-radius: 20px; background: #FFD60A"></div>
    <div style="flex: 1; height: 120px; border: 2.5px solid #F4F0FF; border-radius: 20px; background: #A6F000"></div>
  </div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5, 3, 16, 0.72)"></div>

<section aria-label="New scrap" style="position: absolute; left: 0; right: 0; bottom: 0; height: 676px; box-sizing: border-box; background: #17112E; border-top: 2.5px solid #F4F0FF; border-radius: 32px 32px 0 0; padding: 10px 18px 24px; display: flex; flex-direction: column; gap: 14px">
  <span aria-hidden="true" style="align-self: center; width: 48px; height: 5px; border-radius: 3px; background: #F4F0FF"></span>

  <div style="display: flex; justify-content: space-between; align-items: center">
    <h2 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.045em; display: flex; align-items: center; gap: 10px">new scrap
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFD60A" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>
    </h2>
    <a href="Midnight-Phone-Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; box-sizing: border-box; border: 2.5px solid #F4F0FF; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #F4F0FF; background: #221A40">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
  </div>

  <label style="display: flex; flex-direction: column; gap: 6px">
    <span class="mono" style="font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase">what's keeping you up</span>
    <textarea placeholder="3am thought? spill it. we'll sort it out in the morning." style="height: 92px; resize: none; border: 2.5px solid #F4F0FF; border-radius: 18px; padding: 12px 14px; font: inherit; font-size: 17px; background: #221A40; color: #F4F0FF; outline: none; box-sizing: border-box"></textarea>
  </label>

  <span class="mono" style="font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase">or pick a type</span>

  <div role="radiogroup" aria-label="Scrap type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{types}}" as="t" hint-placeholder-count="6">
      <button type="button" role="radio" aria-checked="{{t.checked}}" onClick="{{t.pick}}" style="{{t.style}}">
        <span style="{{t.dot}}"><span style="font-weight: 800; font-size: 15px">{{t.glyph}}</span></span>
        <span style="font-size: 15px; font-weight: 700">{{t.name}}</span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; border: 2.5px dashed #A99FD0; border-radius: 18px; padding: 10px 10px 10px 14px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
    <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
      <span style="font-size: 14px; font-weight: 700">link on your clipboard</span>
      <span class="mono" style="font-size: 11px; color: #A99FD0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[COPIED LINK]</span>
    </span>
    <button type="button" style="flex: none; height: 44px; padding: 0 14px; border: 2.5px solid #F4F0FF; border-radius: 12px; background: #2340FF; color: #F4F0FF; font-weight: 700; font-size: 14px; cursor: pointer">paste</button>
  </div>

  <div style="display: flex; gap: 10px; margin-top: auto">
    <button type="button" style="flex: none; height: 58px; padding: 0 14px; border: 2.5px solid #F4F0FF; border-radius: 18px; background: #221A40; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; cursor: pointer">
      <span style="width: 14px; height: 14px; border-radius: 4px; background: #FFD60A; border: 2px solid #F4F0FF"></span>brain dump
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button type="button" style="flex: 1; height: 58px; border: 2.5px solid #F4F0FF; border-radius: 18px; background: #F4F0FF; color: #0B0820; font-weight: 800; font-size: 19px; letter-spacing: -0.02em; cursor: pointer; box-shadow: 4px 4px 0 {{accent}}">save it, sleep</button>
  </div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF3EA5","options":["#FF3EA5","#A6F000","#FFD60A","#9F7BFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 4 };
  }
  renderVals() {
    const defs = [
      ['T', 'text', '#FFD60A', '#0B0820'],
      ['✓', 'list', '#A6F000', '#0B0820'],
      ['▢', 'pic', '#FF3EA5', '#0B0820'],
      ['↗', 'link', '#2340FF', '#F4F0FF'],
      ['●', 'voice', '#9F7BFF', '#0B0820'],
      ['★', 'sticker', '#FF6A00', '#0B0820']
    ];
    const types = defs.map(([glyph, name, bg, fg], i) => {
      const on = this.state.sel === i;
      return {
        glyph, name, checked: String(on),
        pick: () => this.setState({ sel: i }),
        style: 'height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2.5px solid #F4F0FF;border-radius:18px;cursor:pointer;transition:transform .15s;background:' + (on ? bg : '#221A40') + ';box-shadow:' + (on ? '4px 4px 0 #F4F0FF;transform:translate(-2px,-2px)' : 'none') + ';color:' + (on ? fg : '#F4F0FF'),
        dot: 'width:32px;height:32px;box-sizing:border-box;border-radius:10px;border:2px solid ' + (on ? '#0B0820' : '#F4F0FF') + ';display:flex;align-items:center;justify-content:center;background:' + (on ? '#F4F0FF' : bg) + ';color:' + (on ? '#0B0820' : fg)
      };
    });
    return { types, accent: this.props.accent ?? '#FF3EA5' };
  }
}
</script>
</body>
</html>
