<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scraps. checklist note</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2340FF}a:hover{color:#1630D9}
button{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EDE7FF; color: #111; font-family: 'Bricolage Grotesque', system-ui, sans-serif">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px">
  <a href="Phone-Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border: 2.5px solid #111; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #111">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <span class="mono" style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase">recipes i'll never make</span>
  <button type="button" aria-label="More options" style="width: 44px; height: 44px; border: 2.5px solid #111; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#111" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
  </button>
</header>

<div style="padding: 4px 18px 0; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 12px">
    <h1 style="margin: 0; font-size: 42px; line-height: 1; font-weight: 800; letter-spacing: -0.05em">grocery run</h1>
    <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true" style="transform: rotate(12deg); flex: none"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#FF6A00" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>

  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <span style="display: inline-flex; align-items: center; gap: 6px; border: 2px solid #111; border-radius: 999px; padding: 4px 11px; background: #FFFFFF; font-size: 13px; font-weight: 600"><span class="mono" style="font-size: 10px; color: #555">due</span>saturday</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; border: 2px solid #111; border-radius: 999px; padding: 4px 11px; background: #9F7BFF; font-size: 13px; font-weight: 600">shared w/ 2</span>
  </div>

  <div style="border: 2.5px solid #111; border-radius: 22px; background: #A6F000; padding: 14px 16px; box-shadow: 4px 4px 0 #111; display: flex; align-items: center; gap: 16px">
    <span style="font-size: 44px; font-weight: 800; letter-spacing: -0.05em; line-height: 1">{{doneCount}}/{{total}}</span>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">{{cheer}}</span>
      <div style="height: 12px; border: 2px solid #111; border-radius: 999px; background: #FFFFFF; overflow: hidden">
        <div style="height: 100%; background: #111; width: {{pct}}; transition: width .3s"></div>
      </div>
    </div>
  </div>

  <div style="border: 2.5px solid #111; border-radius: 22px; background: #FFFFFF; overflow: hidden">
    <sc-for list="{{todos}}" as="t" hint-placeholder-count="7">
      <button type="button" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 14px; background: transparent; border: 0; border-bottom: 2px solid #E6DEFF; text-align: left; cursor: pointer; font-size: 16px; font-weight: 500">
        <span style="{{t.box}}"><sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A6F000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if></span>
        <span style="{{t.label}}">{{t.text}}</span>
      </button>
    </sc-for>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.8" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="M12 5v14M5 12h14"/></svg>
      <input type="text" placeholder="add a thing" aria-label="Add an item" style="border: 0; background: transparent; font: inherit; font-size: 16px; outline: none; flex: 1; min-width: 0; color: #111">
    </label>
  </div>
</div>

<div role="toolbar" aria-label="Add a block" style="position: absolute; left: 18px; right: 18px; bottom: 22px; height: 64px; border-radius: 22px; background: #111; display: flex; align-items: center; justify-content: space-around; padding: 0 6px; box-shadow: 4px 4px 0 #FF3EA5">
  <button type="button" aria-label="Text block" style="width: 46px; height: 46px; border: 0; border-radius: 14px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 6h14M12 6v13"/></svg></button>
  <button type="button" aria-label="Checklist block" style="width: 46px; height: 46px; border: 2px solid #111; border-radius: 14px; background: #A6F000; color: #111; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  <button type="button" aria-label="Image block" style="width: 46px; height: 46px; border: 0; border-radius: 14px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></button>
  <button type="button" aria-label="Link block" style="width: 46px; height: 46px; border: 0; border-radius: 14px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
  <button type="button" aria-label="Voice memo" style="width: 46px; height: 46px; border: 0; border-radius: 14px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button type="button" aria-label="Sticker" style="width: 46px; height: 46px; border: 0; border-radius: 14px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5q3.5 3.5 7 0"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="3.4"/></svg></button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { 0: true, 1: true, 4: true } };
  }
  renderVals() {
    const items = ['oat milk', 'eggs (the big pack)', 'spinach i will actually use', 'chili crisp', 'frozen dumplings', 'lemons', 'a treat for me'];
    const d = this.state.done;
    const todos = items.map((text, i) => {
      const done = !!d[i];
      return {
        text, done, pressed: String(done),
        toggle: () => this.setState({ done: { ...d, [i]: !done } }),
        box: 'flex:none;width:26px;height:26px;border:2.5px solid #111;border-radius:8px;display:flex;align-items:center;justify-content:center;background:' + (done ? '#111' : '#fff'),
        label: done ? 'text-decoration:line-through;opacity:.55' : ''
      };
    });
    const n = todos.filter((t) => t.done).length;
    const cheer = n === items.length ? 'all done. iconic.' : n === 0 ? 'fresh start, let’s go' : n >= 5 ? 'so close, keep going' : 'making moves';
    return { todos, doneCount: n, total: items.length, pct: Math.round((n / items.length) * 100) + '%', cheer };
  }
}
</script>
</body>
</html>
