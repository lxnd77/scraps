name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck, lint and unit tests across the workspace; fails on type or lint errors
      - run: pnpm check

      # local Supabase stack: applies migrations and seed.sql, serves auth and Mailpit
      - name: Start Supabase
        run: pnpm db:start

      # policy and trigger tests (pgTAP)
      - name: Database tests
        run: pnpm db:test

      # one place that turns `supabase status` into env for the web build, the collab server and
      # the integration tests
      - name: Export local Supabase env
        run: |
          pnpm exec supabase status -o env > /tmp/supabase.env
          val() { grep -E "^$1=" /tmp/supabase.env | head -1 | cut -d= -f2- | tr -d '"'; }
          # first key that has a value (newer CLIs print PUBLISHABLE_KEY / SECRET_KEY, older ones ANON_KEY / SERVICE_ROLE_KEY)
          first() { for k in "$@"; do v="$(val "$k")"; if [ -n "$v" ]; then echo "$v"; return; fi; done; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(val API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(first PUBLISHABLE_KEY ANON_KEY)"
            echo "NEXT_PUBLIC_COLLAB_URL=ws://localhost:1234"
            echo "SUPABASE_URL=$(val API_URL)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(first SECRET_KEY SERVICE_ROLE_KEY)"
            echo "SUPABASE_ANON_KEY=$(first PUBLISHABLE_KEY ANON_KEY)"
            echo "INTERNAL_SECRET=ci-internal-secret-0123456789"
          } >> "$GITHUB_ENV"

      # the capture Edge Function creates notes through the collab server with the internal secret;
      # the Edge runtime runs in Docker, so it reaches the host through host.docker.internal
      - name: Edge Function env
        run: |
          {
            echo "INTERNAL_SECRET=$INTERNAL_SECRET"
            echo "COLLAB_INTERNAL_URL=http://host.docker.internal:1234"
            echo "APP_URL=http://localhost:3100"
          } > supabase/functions/.env

      # real auth (ES256 via JWKS), real store, real WebSocket sync
      - name: Collab integration tests
        run: pnpm --filter @scraps/collab test:int

      - run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm --filter @scraps/web exec playwright install --with-deps chromium

      # styleguide, auth, onboarding, shell, editor, theme persistence, axe, service worker spike
      - run: pnpm e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: pnpm db:stop
