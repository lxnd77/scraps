name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck, lint and unit tests across the workspace; fails on type or lint errors
      - run: pnpm check

      - run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm --filter @scraps/web exec playwright install --with-deps chromium

      # styleguide in both themes, axe, theme persistence, service worker spike
      - run: pnpm e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
